# For a server that already runs nginx for other sites. Use this instead of
# the Caddy profile: `docker compose up -d --build`, then install this file
# as /etc/nginx/sites-available/play.lunarark.com, enable it, and run
#   certbot --nginx -d play.lunarark.com
# to add HTTPS. See docs/DEPLOY.md, option B.
server {
    listen 80;
    server_name play.lunarark.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
