<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tranquility</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: the Moon fills the screen; instruments float at the edges like a flight console.
   One loud element, the lunar-day track at the top. Everything else stays quiet. Single dark theme by choice. */
:root {
  color-scheme: dark;
  --void: #06050f;
  --panel: rgba(15, 13, 28, 0.86);
  --line: #2b2840;
  --ink: #ece8f7;
  --dim: #9a95b3;
  --sun: #ffc15e;
  --cold: #86b6ff;
  --ok: #62d394;
  --warn: #ff9a3d;
  --bad: #ff5a5f;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--void); color: var(--ink); font: 400 14px/1.45 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
kbd { font: 500 11px var(--mono); padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--dim); }
#app { position: relative; height: 100%; overflow: hidden;
  background: radial-gradient(120% 80% at 70% -10%, #17143a 0%, #0a0818 45%, var(--void) 100%); }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; cursor: crosshair; }

.earth { position: absolute; right: 7%; top: 13%; width: 54px; height: 54px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 32% 34%, #9fd0ff 0%, #3f7fe0 34%, #173a8f 62%, #06102e 100%);
  box-shadow: inset -14px -10px 18px rgba(2, 3, 12, 0.92), 0 0 28px rgba(110, 160, 255, 0.28); opacity: 0.9; }

/* ---------- top: brand, the resource strip, two buttons. The clock lives with the Moon at the bottom right. ---------- */
.top { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 12px; padding: 8px 14px 0; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { flex: 0 0 auto; display: flex; align-items: baseline; gap: 10px; line-height: 1; }
.brand b { font: 800 22px/1 var(--display); letter-spacing: 0.05em; text-transform: uppercase; }
.brand span { font: 500 10px var(--mono); color: var(--dim); letter-spacing: 0.06em; text-transform: uppercase; }
.speed button, #btn-help, #btn-map { min-width: 32px; height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font: 600 11px var(--mono); }
.speed button:hover, #btn-help:hover, #btn-map:hover { border-color: var(--dim); }
.speed button[aria-pressed="true"] { background: var(--sun); border-color: var(--sun); color: #1b1203; }
#btn-map { flex: 0 0 auto; } #btn-map[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #06200f; }
#btn-help { flex: 0 0 auto; border-color: var(--sun); color: var(--sun); }
.lede b, .rule b { color: var(--sun); }

/* ---------- time: the Moon as Earth sees it, with the base marked. When the shadow line crosses the mark, the Sun rises or sets. ---------- */
.time { position: absolute; right: 14px; bottom: 12px; display: grid; grid-template-columns: auto auto; align-items: center; gap: 4px 12px; pointer-events: none; }
.time > * { pointer-events: auto; }
.tinfo { text-align: right; line-height: 1.15; }
#phase { display: block; font: 800 26px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; }
#phase.day { color: var(--sun); } #phase.night { color: var(--cold); }
#countdown { display: block; margin-top: 3px; font: 500 12px var(--mono); font-variant-numeric: tabular-nums; }
#hour { display: block; margin-top: 2px; font: 400 10px var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
#event { display: inline-block; margin-top: 5px; padding: 1px 8px; border-radius: 999px; font: 600 10px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; background: rgba(255, 154, 61, 0.16); color: var(--warn); border: 1px solid rgba(255, 154, 61, 0.5); }
#event[data-tone="bad"] { background: rgba(255, 90, 95, 0.18); color: var(--bad); border-color: rgba(255, 90, 95, 0.6); }
.moonbox { display: grid; justify-items: center; gap: 3px; }
.moonbox .mn { font: 600 10px var(--mono); letter-spacing: 0.06em; color: #5fd3f3; white-space: nowrap; }
.moonbox .mv { font: 500 8px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
.moon { width: 86px; height: 86px; padding: 6px; border-radius: 50%; background: #05040c; border: 1px solid var(--line); box-shadow: 0 0 0 4px rgba(5, 4, 12, 0.6), 0 8px 24px rgba(0, 0, 0, 0.6); }
.moon svg { display: block; width: 100%; height: 100%; }
#moon-base { fill: var(--sun); stroke: #1b1203; stroke-width: 0.8; } #moon-base.night { fill: var(--cold); stroke: #fff; }
.speed { grid-column: 1 / 3; justify-self: end; display: flex; gap: 3px; }
svg.ic { width: 16px; height: 16px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- resource strip: one icon, one name, one number each. Click for the detail. ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(8px); }
.res { flex: 0 1 auto; min-width: 0; margin: 0 auto; display: flex; gap: 2px; padding: 3px; overflow-x: auto; scrollbar-width: none; }
.chip { position: relative; flex: 0 0 auto; display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px 3px; border: 0; border-radius: 9px; background: transparent; white-space: nowrap; }
.chip:hover, .chip[aria-expanded="true"] { background: #1f1b38; }
.chip svg { color: var(--dim); width: 15px; height: 15px; }
.chip .cn { font: 500 10px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.chip .cv { font: 800 18px/1 var(--display); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.chip .cb { position: absolute; left: 11px; right: 11px; bottom: 4px; height: 2px; border-radius: 1px; background: #26233c; overflow: hidden; }
.chip .cb i { display: block; height: 100%; width: 0; background: var(--ok); transition: width 0.3s; }
.chip[data-tone="sun"] .cb i { background: var(--sun); }
.chip[data-tone="warn"] .cv, .chip[data-tone="warn"] svg { color: var(--warn); } .chip[data-tone="warn"] .cb i { background: var(--warn); }
.chip[data-tone="bad"] { background: rgba(255, 90, 95, 0.16); } .chip[data-tone="bad"] .cv, .chip[data-tone="bad"] svg { color: var(--bad); } .chip[data-tone="bad"] .cb i { background: var(--bad); }
.respop { position: absolute; top: 54px; width: 264px; padding: 12px 14px; z-index: 4; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5); }
.respop h2 { margin: 0 0 4px; font: 800 28px/1 var(--display); letter-spacing: 0.02em; }
.respop .rs { margin: 0 0 8px; font: 500 12px var(--mono); color: var(--ink); }
.respop[data-tone="warn"] .rs { color: var(--warn); } .respop[data-tone="bad"] .rs { color: var(--bad); }
.respop .rn { margin: 8px 0 0; font-size: 12.5px; color: #cfcbe0; }
.gb { height: 4px; border-radius: 2px; background: #24213a; overflow: hidden; } .gb i { display: block; height: 100%; background: var(--ok); }
.respop[data-tone="warn"] .gb i { background: var(--warn); } .respop[data-tone="bad"] .gb i { background: var(--bad); } .respop[data-tone="sun"] .gb i { background: var(--sun); }

/* ---------- left rail: the crew, then the drawers ---------- */
.rail { position: absolute; left: 12px; top: 58px; width: 60px; padding: 5px 0; display: flex; flex-direction: column; align-items: center; gap: 1px; max-height: calc(100% - 70px); overflow-y: auto; scrollbar-width: none; }
.rb { position: relative; width: 52px; padding: 5px 0 4px; border: 0; border-radius: 9px; background: transparent; display: grid; justify-items: center; gap: 3px; }
.rb:hover, .rb[aria-pressed="true"] { background: #1f1b38; }
.rb > span:not(.face) { font: 500 9px var(--mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--dim); }
.rb[aria-pressed="true"] > span:not(.face) { color: var(--ink); }
.rb svg { width: 18px; height: 18px; margin: 3px 0 1px; color: #cfcbe0; }
.rb .face { flex: none; width: 30px; height: 30px; font-size: 11px; box-shadow: 0 0 0 2px #0f0d1c, 0 0 0 3px rgba(255, 255, 255, 0.22); }
.rb[data-tone="warn"] .face { box-shadow: 0 0 0 2px #0f0d1c, 0 0 0 3px var(--warn); } .rb[data-tone="bad"] .face { box-shadow: 0 0 0 2px #0f0d1c, 0 0 0 3px var(--bad); }
.rb[data-tone="dead"] { opacity: 0.35; }
.bd { position: absolute; top: 3px; right: 6px; min-width: 10px; height: 10px; padding: 0 2px; border-radius: 5px; background: var(--sun); color: #1b1203; font: 600 8px/10px var(--mono); text-align: center; box-shadow: 0 0 0 2px #0f0d1c; }
.bd[data-tone="bad"] { background: var(--bad); color: #fff; } .bd[data-tone="warn"] { background: var(--warn); } .bd[data-tone="dim"] { background: var(--cold); }
.bd[hidden] { display: none; }
.rsep { width: 30px; height: 1px; margin: 4px 0; background: var(--line); }
.rci { display: flex; gap: 3px; height: 24px; margin: 1px 0; padding: 0 2px; position: relative; }
.rci::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(255, 255, 255, 0.3); }
.rci b { position: relative; width: 7px; height: 100%; border-radius: 2px; background: #26233c; overflow: hidden; }
.rci b i { position: absolute; left: 0; right: 0; }

/* ---------- messages: a badge on the face, a brief preview when one arrives, the thread in the drawer ---------- */
.leftcol { position: absolute; left: 80px; top: 58px; width: 336px; max-height: calc(100% - 186px); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.leftcol > * { pointer-events: auto; }
.bubble { position: absolute; left: 80px; width: 300px; padding: 9px 12px 10px; border-radius: 4px 12px 12px 12px; border-left: 3px solid var(--sun); cursor: pointer; z-index: 3; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5); animation: in 0.25s ease-out; }
.bubble::before { content: ""; position: absolute; left: -9px; top: 12px; border: 6px solid transparent; border-right-color: var(--sun); border-left: 0; }
.bubble[data-tone="bad"] { border-left-color: var(--bad); } .bubble[data-tone="bad"]::before { border-right-color: var(--bad); }
.bubble .bw { margin: 0 0 3px; font: 500 10px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.bubble .bt { margin: 0 0 4px; font: 800 17px/1.08 var(--display); letter-spacing: 0.03em; text-transform: uppercase; text-wrap: balance; }
.bubble .bs { margin: 0 0 8px; font-size: 12.5px; line-height: 1.45; color: #d6d2e6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.bubble .br { display: flex; align-items: center; gap: 10px; } .bubble .br span { font: 500 10px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }
.nb { padding: 5px 10px; border: 0; border-radius: 7px; background: var(--sun); color: #1b1203; font-weight: 600; font-size: 12px; white-space: nowrap; }
.nb:hover { filter: brightness(1.08); } .nb.wait { background: #2a2740; color: var(--dim); cursor: default; }
.thread { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.msg { padding: 8px 10px 9px; border-radius: 3px 10px 10px 10px; background: #1a1730; border-left: 3px solid var(--line); }
.msg[data-kind="ask"] { border-left-color: var(--sun); } .msg[data-kind="urgent"] { border-left-color: var(--bad); background: rgba(52, 12, 20, 0.7); }
.msg[data-kind="done"] { background: transparent; padding: 2px 10px; color: var(--dim); }
.msg[data-tone="good"] { border-left-color: var(--ok); } .msg[data-tone="warn"] { border-left-color: var(--warn); } .msg[data-tone="bad"] { border-left-color: var(--bad); }
.msg b { display: block; margin-bottom: 3px; font: 800 15px/1.1 var(--display); letter-spacing: 0.03em; text-transform: uppercase; }
.msg p { margin: 0 0 6px; font-size: 13px; line-height: 1.5; color: #d6d2e6; } .msg p:last-child { margin-bottom: 0; }
.msg time, .msg .mm { display: block; font: 500 10px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); } .msg .mm em { font-style: normal; color: var(--sun); }
.msg .nb { margin: 2px 0 6px; }
.rb.asking .face { box-shadow: 0 0 0 2px #0f0d1c, 0 0 0 3.5px var(--sun); }
.bd[data-tone="new"] { background: #25d366; color: #04240f; min-width: 15px; height: 15px; border-radius: 8px; font: 700 9px/15px var(--mono); top: 0; right: 3px; }
.bd[data-tone="urgent"] { background: var(--bad); color: #fff; min-width: 15px; height: 15px; border-radius: 8px; font: 700 10px/15px var(--mono); top: 0; right: 3px; }
.say::before { content: "\201C"; } .say::after { content: "\201D"; }
.who { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.face { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--mono); color: #14110a; box-shadow: 0 0 0 2px #0f0d1c, 0 0 0 3px rgba(255, 255, 255, 0.25); }
.face.sm { flex-basis: 20px; width: 20px; height: 20px; font-size: 8px; box-shadow: none; }
.spk b { display: block; font-weight: 600; font-size: 13px; line-height: 1.2; }
.spk i { display: block; font: 500 10px var(--mono); font-style: normal; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }

/* ---------- drawer: one open at a time ---------- */
.drawer { min-height: 0; overflow-y: auto; scrollbar-width: thin; padding: 12px 14px 14px; }
.drawer[hidden] { display: none; }
.dh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.dh h2 { margin: 0; font: 800 22px/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; color: var(--sun); }
.x { width: 26px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: transparent; color: var(--dim); font: 500 14px/1 var(--mono); }
.x:hover { border-color: var(--dim); color: var(--ink); }
.drawer h3 { margin: 12px 0 6px; } .drawer h3:first-of-type { margin-top: 0; }
.drawer .sub { margin: -4px 0 10px; font: 500 11px var(--mono); color: var(--dim); }
.drawer p.txt { margin: 0 0 8px; font-size: 13px; line-height: 1.5; color: #d6d2e6; }
h3 { margin: 0 0 8px; font: 600 11px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.cstats { grid-template-columns: repeat(4, 1fr); margin-bottom: 8px; }
.line { margin: 0; padding: 4px 0; font-size: 12.5px; color: #cfcbe0; border-top: 1px solid var(--line); }
.line[data-tone="bad"] { color: var(--bad); }
.crewlist, .roll, .log { list-style: none; margin: 0; padding: 0; }
.crewlist { margin-top: 8px; }
.crewlist li { display: grid; grid-template-columns: 20px 1fr 64px 26px; align-items: center; gap: 8px; padding: 3px 0; }
.crewlist b { display: block; font-weight: 600; font-size: 13px; }
.crewlist em { font: 500 12px var(--mono); font-style: normal; text-align: right; font-variant-numeric: tabular-nums; }
.hp { height: 5px; border-radius: 3px; background: #24213a; overflow: hidden; }
.hp i { display: block; height: 100%; background: var(--ok); }
li[data-tone="warn"] .hp i, .hp[data-tone="warn"] i { background: var(--warn); } li[data-tone="bad"] .hp i, .hp[data-tone="bad"] i { background: var(--bad); }
li[data-tone="dead"] { opacity: 0.45; } li[data-tone="dead"] b { text-decoration: line-through; }
.log li { display: grid; grid-template-columns: 46px 1fr; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 12.5px; color: #cfcbe0; }
.log li:first-child { border-top: 0; }
.log time { font: 500 10px var(--mono); color: var(--dim); padding-top: 2px; }
.log li[data-tone="bad"] { color: #ffc4c6; } .log li[data-tone="warn"] { color: #ffd9a8; } .log li[data-tone="good"] { color: #c9f2da; }
.dbtn { margin-top: 6px; padding: 7px 12px; border: 0; border-radius: 8px; background: var(--sun); color: #1b1203; font-weight: 600; font-size: 13px; }

/* ---------- inspector: compact, with the reading behind "More" ---------- */
.right { position: absolute; right: 14px; top: 58px; width: 270px; max-height: calc(100% - 58px - 190px); overflow-y: auto; scrollbar-width: thin; padding: 12px 14px 14px; display: none; }
.right.show { display: block; }
.right .x { position: absolute; right: 10px; top: 10px; }
.eyebrow { margin: 0 0 4px; font: 500 11px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.right h2 { margin: 0 30px 6px 0; font: 800 22px/1 var(--display); letter-spacing: 0.03em; text-transform: uppercase; }
.right p { margin: 0 0 8px; color: #cfcbe0; font-size: 13px; }
.right .effect { font: 500 12px var(--mono); color: var(--sun); }
.state { display: inline-block; padding: 2px 8px; border-radius: 9px; font: 600 11px var(--mono); background: #1a1730; }
.state[data-tone="ok"] { color: var(--ok); } .state[data-tone="bad"] { color: var(--bad); } .state[data-tone="warn"] { color: var(--warn); }
.state[data-tone="sun"] { color: var(--sun); } .state[data-tone="dim"] { color: var(--dim); }
dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(74px, 1fr)); gap: 8px; margin: 0 0 10px; }
dt { font: 500 10px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
dd { margin: 0; font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
.right dl { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); }
.codex { display: inline-block; margin-bottom: 4px; font: 500 11px var(--mono); color: var(--cold); text-decoration: none; border-bottom: 1px dotted var(--cold); }
details.more { margin: 0 0 10px; } details.more summary { cursor: pointer; font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: " +"; } details.more[open] summary::after { content: " −"; }
details.more[open] summary { margin-bottom: 8px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.acts button { padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px; background: #1a1730; font-weight: 500; font-size: 13px; }
.acts button:hover { border-color: var(--dim); }
.acts .primary { background: var(--sun); border-color: var(--sun); color: #1b1203; font-weight: 600; }
.acts .danger { color: #ffb3b5; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }

/* ---------- alerts: brief, then they live in the log ---------- */
.alerts { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); width: min(430px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.toast { padding: 7px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--cold); font-size: 13px; animation: in 0.25s ease-out; transition: opacity 0.5s; }
.toast[data-tone="good"] { border-left-color: var(--ok); } .toast[data-tone="warn"] { border-left-color: var(--warn); }
.toast[data-tone="bad"] { border-left-color: var(--bad); background: rgba(52, 12, 20, 0.92); }
.toast.out { opacity: 0; }
@keyframes in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

/* ---------- bottom: five categories, a tray above the one that is open ---------- */
.bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 14px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.bottom > * { pointer-events: auto; max-width: 100%; }
#hint { min-height: 20px; padding: 2px 10px; border-radius: 999px; font: 500 12px var(--mono); color: #ffd9a8; background: rgba(15, 13, 28, 0.8); pointer-events: none; }
#hint:empty { visibility: hidden; }
.tray { display: flex; gap: 5px; padding: 5px; overflow-x: auto; scrollbar-width: none; }
.tray[hidden] { display: none; }
.cats { display: flex; gap: 2px; padding: 4px; }
.cat { position: relative; display: grid; justify-items: center; gap: 3px; min-width: 84px; padding: 7px 10px 5px; border: 0; border-radius: 9px; background: transparent; }
.cat:hover, .cat[aria-pressed="true"] { background: #1f1b38; }
.cat svg { width: 19px; height: 19px; color: #cfcbe0; }
.cat span { font: 500 10px var(--mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
.cat[aria-pressed="true"] svg, .cat[aria-pressed="true"] span, .cat.has svg, .cat.has span { color: var(--sun); }
.tool { flex: 0 0 auto; display: grid; grid-template-columns: 10px auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center; text-align: left;
  padding: 6px 26px 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: #151228; position: relative; }
.tool i { grid-row: 1 / 3; width: 10px; height: 24px; border-radius: 3px; }
.tool .tn { font-weight: 500; font-size: 12.5px; white-space: nowrap; }
.tool .tc { font: 500 11px var(--mono); color: var(--sun); } .tool .tc::after { content: " cr"; color: var(--dim); }
.tool .tz { font: 500 10px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.tool kbd { position: absolute; right: 7px; top: 6px; border: 0; padding: 0; font-size: 10px; opacity: 0.6; }
.tool:hover { border-color: var(--dim); }
.tool.active { border-color: var(--sun); background: #2a2110; box-shadow: 0 0 0 1px var(--sun) inset; }
.tool.poor .tc { color: var(--bad); } .tool.poor .tn { color: var(--dim); }
.tool.zone i { border-radius: 50%; width: 10px; height: 10px; }

/* ---------- dialogs ---------- */
.modal { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(4, 3, 12, 0.72); backdrop-filter: blur(3px); overflow-y: auto; }
.modal.show { display: flex; }
.card { width: min(560px, 100%); padding: 28px 28px 24px; background: #0f0d1c; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); }
.card h1 { margin: 0 0 12px; font: 800 clamp(48px, 11vw, 84px)/0.86 var(--display); letter-spacing: 0.02em; text-transform: uppercase; color: var(--sun); text-wrap: balance; }
.lede { margin: 0 0 16px; font-size: 16px; line-height: 1.5; max-width: 46ch; }
.brief { margin: 0 0 16px; padding-left: 20px; color: #cfcbe0; } .brief li { margin-bottom: 6px; } .brief b { color: var(--ink); }
.keys { margin: 0 0 18px; font-size: 12px; color: var(--dim); }
.roll { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; margin-bottom: 16px; }
.roll li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.roll span { font: 500 12px var(--mono); color: var(--ok); } .roll li[data-tone="warn"] span { color: var(--warn); } .roll li[data-tone="dead"] span { color: var(--bad); }
.stats { grid-template-columns: repeat(4, 1fr); margin-bottom: 18px; }

/* ---------- contracts and needs ---------- */
.offercard h2 { margin: 0 0 10px; font: 800 clamp(30px, 6vw, 44px)/0.95 var(--display); letter-spacing: 0.02em; text-transform: uppercase; color: var(--sun); text-wrap: balance; }
.terms { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin: 0 0 16px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.terms dt { font: 500 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); margin-bottom: 2px; } .terms dd { margin: 0; font-size: 13.5px; line-height: 1.35; }
.voice { display: flex; gap: 12px; margin-bottom: 12px; padding: 10px 12px; border-radius: 10px; background: #151228; border-left: 3px solid var(--ok); }
.voice[data-side="con"] { border-left-color: var(--warn); }
.voice b { display: block; font: 500 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); margin-bottom: 3px; }
.voice p { margin: 0; font-size: 13.5px; line-height: 1.5; }
.offercard .acts { margin-top: 18px; }
.needs, .deals { list-style: none; margin: 0 0 4px; padding: 0; display: grid; gap: 4px; }
.needs li { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.needs li i { flex: 0 0 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.needs li[data-met="false"] { color: var(--warn); } .needs li[data-met="false"] i { background: var(--warn); }
.deals li { display: grid; gap: 1px; padding: 6px 8px; border-radius: 8px; background: #151228; border-left: 2px solid var(--sun); }
.deals b { font-weight: 600; font-size: 12.5px; } .deals span { font-size: 12px; color: #cfcbe0; }
.deals em { font: 400 11px var(--mono); font-style: normal; color: var(--dim); } .deals li[data-tone="warn"] em { color: var(--warn); }

/* ---------- demand, budget ---------- */
.demand { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.demand li { display: grid; grid-template-columns: 88px 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; }
.demand b { font-weight: 600; font-size: 12.5px; }
.demand em { grid-column: 2; font: 400 11px var(--mono); font-style: normal; color: var(--dim); }
.demand li.blocked em { color: var(--warn); }
.dbar { position: relative; height: 8px; border-radius: 4px; background: #24213a; overflow: hidden; }
.dbar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255, 255, 255, 0.35); }
.dbar i { position: absolute; top: 0; bottom: 0; }
.budget { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; margin: 0 0 8px; }
.budget div { display: flex; justify-content: space-between; align-items: baseline; }
.budget dt { letter-spacing: 0.04em; } .budget dd { font-size: 12px; }
.budget .net { grid-column: 1 / 3; margin-top: 4px; padding-top: 5px; border-top: 1px solid var(--line); } .budget .net dd { font-size: 14px; color: var(--sun); }
.prices { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; font: 500 10px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.prices button { padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: #1a1730; font: 500 11px var(--mono); }
.prices button[aria-pressed="true"] { background: var(--sun); border-color: var(--sun); color: #1b1203; }

/* ---------- narrow screens ---------- */
@media (max-width: 1500px) { .brand span { display: none; } .chip { padding: 0 9px 3px; gap: 6px; } }
@media (max-width: 1240px) { .chip .cn { display: none; } }
@media (max-width: 1100px) { .time { bottom: 86px; } }
@media (max-width: 820px) {
  .top { flex-wrap: wrap; gap: 6px 8px; padding: 8px 10px 0; } .earth { display: none; }
  .brand b { font-size: 16px; } .brand { margin-right: auto; }
  #btn-map { font-size: 0; } #btn-map::after { content: "Map"; font-size: 11px; }
  .speed button, #btn-help, #btn-map { min-width: 27px; height: 28px; padding: 0 5px; }
  .res { order: 3; flex-basis: 100%; margin: 0; } .chip { height: 32px; padding: 0 9px 3px; gap: 5px; } .chip .cv { font-size: 16px; }
  .respop { top: 92px; left: 10px !important; right: 10px; width: auto; }
  .rail { top: 92px; left: 8px; width: 50px; } .rb { width: 44px; } .rb .face { width: 26px; height: 26px; }
  .leftcol { top: 92px; left: 64px; right: 10px; width: auto; max-height: 48%; z-index: 3; }
  .bubble { left: 64px; width: auto; right: 10px; }
  .alerts { top: auto; bottom: 196px; }
  .right { top: auto; left: 64px; right: 10px; bottom: 132px; width: auto; max-height: 34%; z-index: 2; }
  .time { right: 10px; bottom: 84px; gap: 3px 8px; } .moon { width: 50px; height: 50px; padding: 4px; } .moonbox .mv, .moonbox .mn, #hour { display: none; } #phase { font-size: 18px; } #countdown { font-size: 10px; }
  .cat { min-width: 62px; padding: 6px 6px 4px; } .tool kbd { display: none; } .tool { padding-right: 10px; }
  .roll, .stats { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { .toast, .bubble { animation: none; } .chip .cb i { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div class="earth" aria-hidden="true"></div>

  <header class="top">
    <div class="brand"><b>Tranquility</b><span>Mare Tranquillitatis</span></div>
    <div class="res panel" id="res" role="toolbar" aria-label="Resources">
    <button type="button" class="chip" id="g-people" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg><span class="cn">People</span><b class="cv">0</b><i class="cb"><i></i></i></button>
    <button type="button" class="chip" id="g-mat" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M14.5 9.5a3.5 3.5 0 1 0 0 5"/></svg><span class="cn">Credits</span><b class="cv">0</b><i class="cb"><i></i></i></button>
    <button type="button" class="chip" id="g-power" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg><span class="cn">Power</span><b class="cv">0</b><i class="cb"><i></i></i></button>
    <button type="button" class="chip" id="g-store" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="16" height="9" rx="2"/><path d="M21.5 11v3M7 11v3M10.5 11v3"/></svg><span class="cn">Storage</span><b class="cv">0</b><i class="cb"><i></i></i></button>
    <button type="button" class="chip" id="g-o2" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="14" r="5"/><circle cx="17.5" cy="7" r="2.5"/></svg><span class="cn">Oxygen</span><b class="cv">0</b><i class="cb"><i></i></i></button>
    <button type="button" class="chip" id="g-water" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3.5 4.5 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 2.5-6.5 6-11z"/></svg><span class="cn">Water</span><b class="cv">0</b><i class="cb"><i></i></i></button>
    <button type="button" class="chip" id="g-food" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14zM5 19l8-8"/></svg><span class="cn">Food</span><b class="cv">0</b><i class="cb"><i></i></i></button>
    </div>
    <button type="button" id="btn-map" title="Habitability map (H)" aria-pressed="false">Habitability</button>
    <button type="button" id="btn-help" title="How to play (?)" aria-label="How to play">?</button>
  </header>
  <div class="respop panel" id="respop" hidden></div>

  <nav class="rail panel" id="rail" aria-label="Crew and panels"></nav>

  <div class="bubble panel" id="bubble" hidden></div>
  <div class="leftcol">
    <aside class="drawer panel" id="drawer" hidden></aside>
  </div>

  <aside class="right panel" id="inspector" aria-live="polite"></aside>
  <div class="alerts" id="alerts" aria-live="polite"></div>

  <footer class="bottom">
    <div id="hint"></div>
    <div class="tray panel" id="tray" role="toolbar" aria-label="Build" hidden></div>
    <div class="cats panel" id="cats" role="toolbar" aria-label="Build categories"></div>
  </footer>

  <div class="time" id="time">
    <div class="tinfo"><span id="phase" class="day">Day</span><span id="countdown">Sunset in 354 h</span><span id="hour">Hour 0 of 708</span><span id="event" hidden></span></div>
    <div class="moonbox" title="The Moon as Earth sees it. The gold mark is your base. When the shadow line crosses it, the Sun rises or sets.">
      <span class="mn" id="moon-name">Waxing crescent</span>
      <div class="moon"><svg viewBox="-36 -36 72 72" role="img" aria-label="Phase of the Moon, with the base marked">
        <defs><radialGradient id="mg" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="#f1eee6"/><stop offset="0.65" stop-color="#bcb9b2"/><stop offset="1" stop-color="#8d8a85"/></radialGradient><clipPath id="mc"><circle r="34"/></clipPath></defs>
        <circle r="34" fill="url(#mg)"/>
        <g clip-path="url(#mc)" fill="#6f6c69" opacity="0.5"><ellipse cx="-13" cy="-15" rx="10" ry="8"/><ellipse cx="6" cy="-14" rx="6" ry="5.5"/><ellipse cx="14" cy="-3" rx="7" ry="5.5"/><ellipse cx="-24" cy="-2" rx="9" ry="14"/><ellipse cx="-8" cy="13" rx="7" ry="6"/><ellipse cx="24" cy="-10" rx="3.5" ry="4.5"/><ellipse cx="17" cy="8" rx="5" ry="4"/><circle cx="-6" cy="27" r="2.2" fill="#f4f2ec" opacity="0.9"/></g>
        <path id="moon-shade" d="" fill="#06050f" opacity="0.9"/>
        <circle r="34" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.6"/>
        <circle id="moon-base" cx="13.6" cy="-0.6" r="2.7"/>
      </svg></div>
      <span class="mv">View from Earth</span>
    </div>
    <div class="speed" role="group" aria-label="Game speed">
      <button type="button" data-speed="0" aria-pressed="false" title="Pause (Space)">II</button>
      <button type="button" data-speed="1" aria-pressed="true">1×</button>
      <button type="button" data-speed="2" aria-pressed="false">2×</button>
      <button type="button" data-speed="4" aria-pressed="false">4×</button>
      <button type="button" data-speed="8" aria-pressed="false">8×</button>
    </div>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/packages/unsafe-eval.min.js"></script>
<script src="game.js"></script>
</body>
