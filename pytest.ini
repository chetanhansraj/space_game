; Root test configuration, so the whole repository can be tested in one run.
; Each service also carries its own pytest config for running in isolation.
[pytest]
testpaths = orbital/tests market/tests sim/tests voice/tests api/tests
pythonpath =
    orbital/src market/src sim/src voice/src api/src
    orbital/tests market/tests sim/tests voice/tests api/tests
filterwarnings = ignore::DeprecationWarning
markers =
    slow: long-running simulation tests
