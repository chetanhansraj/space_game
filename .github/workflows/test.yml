name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The 'offline' extra pulls DE421 as an importable package, so the
      # orbital tests need no network access to naif.jpl.nasa.gov. Accuracy
      # against DE440 is under an arcsecond -- see docs/DECISIONS.md D6.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e './orbital[offline,dev]' -e './market[dev]'

      - name: Test
        run: pytest -q
